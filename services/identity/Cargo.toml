[package]
name = "identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "identity"
path = "src/main.rs"

[dependencies]
common.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
argon2.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
sqlx.workspace = true
async-trait.workspace = true
uuid.workspace = true
serde.workspace = true
# Meldung der Schlüsseländerungen an den kt-Dienst (kt_notify.rs).
serde_json.workspace = true
reqwest.workspace = true
# OPRF-Kern für Contact Discovery (specs/contact-discovery.md): die
# Server-Auswertung der geblendeten Handles.
oprf.workspace = true
# Proof-of-Work-Sybil-Bremse bei der Registrierung: der Server prüft den
# Client-Nachweis (specs/sealed-sender-und-abuse.md).
pow.workspace = true
# Sealed-Sender-Zertifikate: dieser Dienst stellt sie aus, die Kette
# (Trust Root -> Serverschlüssel -> Absender) prüft der Empfänger-Client.
sealed-cert.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Der Sealed-Sender-Test validiert die ausgestellte Zertifikatskette so,
# wie es der Empfänger-Client täte: mit denselben libsignal-Typen.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "57d41c877d5a55d881fb3f52d9b16900118ee29b" }
rand.workspace = true
