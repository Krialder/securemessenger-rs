[package]
name = "delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sqlx.workspace = true
async-trait.workspace = true
uuid.workspace = true
# Guard der /internal-Routen: das Shared Secret wird nur als SHA-256-Digest
# gehalten und verglichen (gleiches Muster wie bei identity).
sha2.workspace = true
# Message-Franking-Commitment: Verifikation gemeldeter Nachrichten
# (specs/sealed-sender-und-abuse.md), geteilt mit dem Client.
franking.workspace = true
# Ausgehender Aufruf an integrations: delivery meldet Präsenz-Änderungen
# für die Webhooks (best effort, optional per INTEGRATIONS_URL). Derselbe
# Client stellt den inhaltslosen Web-Push-Aufruf an den Browser-Push-Dienst.
reqwest.workspace = true
# VAPID-Signatur des Web-Push (ES256 über P-256): der JWT autorisiert den
# Push beim Browser-Push-Dienst. Nur Signatur, keine Payload-Verschlüsselung
# (der Aufweck-Push ist inhaltslos).
p256 = { version = "0.13", features = ["ecdsa"] }
# Kurzlebige TURN-Zugangsdaten (F2, coturn use-auth-secret): username =
# Ablaufzeit, password = base64(HMAC-SHA1(secret, username)). coturns
# REST-API nutzt HMAC-SHA1.
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# WebSocket-Client für den Echtzeit-Test; spricht das Wire-Protokoll,
# muss also nicht zur axum-internen tungstenite-Version passen.
tokio-tungstenite = "0.26"
futures-util = "0.3"
