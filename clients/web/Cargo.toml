[package]
name = "sm-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Web-Client (Leptos, CSR/WASM): nur Darstellung und Ablaufsteuerung.
# Die Krypto lebt in client-core, die Protokoll-Logik in client-app;
# hier wird nichts davon dupliziert (GOAL.md, dreischichtige
# Client-Architektur). Gebaut wird mit trunk (Trunk.toml, Proxys auf die
# lokalen Dienste).

[[bin]]
name = "sm-web"
path = "src/main.rs"

# Nativ ist sm-web nur ein erklaerender Stub (src/main.rs): alle echten
# Abhaengigkeiten gelten nur fuer wasm32, damit `cargo test --workspace`
# den Browser-Code weder baut noch an ihm scheitern kann.
[target.'cfg(target_arch = "wasm32")'.dependencies]
client-app = { path = "../../crates/client-app" }
client-core = { path = "../../crates/client-core" }
# CSR-Modus: die App rendert vollstaendig im Browser, kein Server-Rendering.
leptos = { version = "0.8", features = ["csr"] }
# Panics landen in der Browser-Konsole statt als stummes "unreachable".
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location"] }
# Uhrzeit fuer die Credential-Gueltigkeit (js_sys::Date), im Browser gibt es
# kein std::time::SystemTime.
js-sys = "0.3"
# Leptos' Renderer verlangt Send von reaktiven Closures; der Browser ist
# eindraehtig, der Client-Zustand (Rc<RefCell<...>>) darum absichtlich nicht
# Send. SendWrapper ueberbrueckt das und panict, falls doch je ein fremder
# Thread zugreift.
send_wrapper = "0.6"
base64 = { workspace = true }
rand = { workspace = true }
# Zustands-Blob der Ablage und Profil/Kontakte: dasselbe debugbare
# JSON-Format wie beim CLI.
serde = { workspace = true }
serde_json = { workspace = true }
# Persistente Ablage: IndexedDB ist die einzige fuer groessere Datenmengen
# gedachte Browser-Ablage; der synchrone Storage-Trait wird ueber einen
# In-Memory-Spiegel mit asynchronem Flush erfuellt (storage.rs).
indexed_db_futures = "0.6"
# WebSocket-Hinweiskanal im Browser: Browser-Sockets koennen keine Header
# setzen, gloo-net kapselt die web-sys-API als Stream/Sink.
gloo-net = { version = "0.7", features = ["websocket"] }
# Der Flush und die Socket-Schleife laufen als spawn_local-Tasks.
wasm-bindgen-futures = "0.4"
# Stream/Sink-Adapter fuer den gloo-net-WebSocket (next/send).
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
