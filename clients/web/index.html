<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecureMessenger</title>
    <link data-trunk rel="rust" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: flex; justify-content: center; }
      main { width: min(42rem, 100vw - 2rem); padding: 1rem 0 4rem; }
      h1 { font-size: 1.4rem; }
      form, .zeile { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
      input { flex: 1; padding: 0.5rem; }
      button { padding: 0.5rem 1rem; cursor: pointer; }
      ul.chat { list-style: none; padding: 0; }
      ul.chat li { padding: 0.4rem 0.6rem; margin: 0.25rem 0; border-radius: 0.5rem; background: rgba(127, 127, 127, 0.15); }
      ul.chat li.eigene { background: rgba(0, 120, 215, 0.2); }
      .status { color: #888; font-size: 0.9rem; min-height: 1.2rem; }
      .warnung { border-left: 3px solid #c60; padding-left: 0.6rem; color: #a60; font-size: 0.85rem; }
    </style>
  </head>
  <body></body>
</html>
