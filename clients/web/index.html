<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecureMessenger</title>
    <link data-trunk rel="css" href="theme.css" />
    <link data-trunk rel="rust" />
    <!--
      FOUC-Guard: Der Client mountet als Leptos-CSR erst nach dem
      WASM-Download. Ohne diese Zeilen bliebe bis dahin der Default-Modus
      stehen und blitzte beim Wechsel auf. Deshalb hier, VOR dem WASM,
      die gespeicherte Modus-Wahl aus localStorage lesen und als
      data-theme am <html> setzen. Fehlt eine Wahl, entscheidet die
      CSS-Media-Query nach der Systempraeferenz.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("sm-theme");
          if (choice) {
            document.documentElement.setAttribute("data-theme", choice);
          }
        } catch (e) {
          /* privates Fenster ohne localStorage: Systempraeferenz gilt */
        }
      })();
    </script>
  </head>
  <body></body>
</html>
