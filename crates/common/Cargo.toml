[package]
name = "common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Für den identity-Gateway-Baustein (Dienst-zu-Dienst, /internal-Routen),
# den directory und delivery teilen.
async-trait.workspace = true
reqwest.workspace = true
# SSRF-Host-Filter (ssrf-Modul): DIESELBE URL-Zerlegung wie reqwest (das
# url-Crate, WHATWG-konform), damit der geprüfte Host mit dem tatsächlich
# angesprochenen übereinstimmt und kein Parser-Unterschied das Filter
# aushebelt (dezimale/hex IP-Literale, Backslash-Autorität).
url = "2"
# Fuer das Shutdown-Signal (SIGTERM/Ctrl-C) des Graceful-Shutdown-Helfers.
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# Das KT-Konto-Commitment (kt-Modul): identity berechnet es, Clients
# rechnen es nach. Die kanonischen Bytes liegen im geteilten kt-format.
kt-format.workspace = true
