# Ein-Befehl-Stack: der ganze Verbund in Containern, gesundheits-geprueft und
# selbstheilend (restart: unless-stopped). `docker compose up -d --build`
# bringt PostgreSQL, MinIO und die sechs Dienste in der richtigen
# Reihenfolge hoch; die Dienste laufen im PRODUKTIONSMODUS (SM_ENV=
# production: fehlende Pflicht-Konfiguration bricht den Start ab, statt
# still auf In-Memory auszuweichen).
#
# Alle Geheimnisse kommen aus einer lokalen `.env` neben dieser Datei
# (nicht eingecheckt; Vorlage .env.example). `scripts\sm.ps1` erzeugt sie
# beim ersten Start mit starken Zufallswerten. Ohne .env bricht compose mit
# einer klaren Fehlermeldung je fehlender Variable ab.
#
#   docker compose up -d --build                 der Verbund
#   docker compose --profile web up -d --build   zusaetzlich der Web-Client
#   docker compose --profile sso up -d           zusaetzlich Keycloak
#   docker compose down                          stoppen (Daten bleiben)
#   docker compose down -v                       stoppen und Daten loeschen
#
# Bequemer Wrapper mit Docker-Selbstheilung: scripts\sm.ps1
#
# Hinweis: die Datenbank-Liste (postgres-init) wird nur bei LEEREM Volume
# eingespielt; nach einer Aenderung dort braucht es `docker compose down -v`.

name: securemessenger

# Geteilte Bausteine der sechs Rust-Dienste: dasselbe Image (ein Build,
# sechsmal gestartet, Auswahl ueber SM_SERVICE), Produktionsmodus,
# Neustart-Politik und ein /ready-Healthcheck.
x-backend: &backend
  image: securemessenger-local:dev
  build:
    context: .
    dockerfile: deploy/compose/Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fehlt in .env (scripts\sm.ps1 erzeugt sie)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:?fehlt in .env}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:?fehlt in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Legt den media-Bucket an, sobald MinIO antwortet, und beendet sich dann
  # (mb --ignore-existing ist idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      KEY: ${MEDIA_S3_ACCESS_KEY:?fehlt in .env}
      SECRET: ${MEDIA_S3_SECRET_KEY:?fehlt in .env}
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$KEY\" \"$$SECRET\"; do sleep 1; done;
      mc mb --ignore-existing local/media;
      echo 'media-Bucket bereit';
      "
    restart: "no"

  identity:
    <<: *backend
    environment:
      SM_SERVICE: identity
      SM_ENV: production
      RUST_LOG: info
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?fehlt in .env}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/identity
      KT_URL: http://kt:8080
      CDS_OPRF_KEY: ${CDS_OPRF_KEY:?fehlt in .env}
      SEALED_SENDER_TRUST_ROOT: ${SEALED_SENDER_TRUST_ROOT:?fehlt in .env}
      POW_DIFFICULTY: "12"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  directory:
    <<: *backend
    environment:
      SM_SERVICE: directory
      SM_ENV: production
      RUST_LOG: info
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?fehlt in .env}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/directory
      IDENTITY_URL: http://identity:8080
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    ports:
      - "8081:8080"

  delivery:
    <<: *backend
    environment:
      SM_SERVICE: delivery
      SM_ENV: production
      RUST_LOG: info
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?fehlt in .env}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/delivery
      IDENTITY_URL: http://identity:8080
      INTEGRATIONS_URL: http://integrations:8080
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    ports:
      - "8082:8080"

  kt:
    <<: *backend
    environment:
      SM_SERVICE: kt
      SM_ENV: production
      RUST_LOG: info
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?fehlt in .env}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/kt
      KT_SIGNING_KEY: ${KT_SIGNING_KEY:?fehlt in .env}
      KT_VRF_KEY: ${KT_VRF_KEY:?fehlt in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8080"

  integrations:
    <<: *backend
    environment:
      SM_SERVICE: integrations
      SM_ENV: production
      RUST_LOG: info
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?fehlt in .env}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/integrations
      IDENTITY_URL: http://identity:8080
      DELIVERY_URL: http://delivery:8080
      INTEGRATIONS_WEBHOOK_SIGNING_KEY: ${INTEGRATIONS_WEBHOOK_SIGNING_KEY:?fehlt in .env}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      delivery:
        condition: service_healthy
    ports:
      - "8085:8080"

  media:
    <<: *backend
    environment:
      SM_SERVICE: media
      SM_ENV: production
      RUST_LOG: info
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?fehlt in .env}
      IDENTITY_URL: http://identity:8080
      MEDIA_S3_BUCKET: media
      MEDIA_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_KEY}
      AWS_REGION: local
    depends_on:
      identity:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8084:8080"

  # Optional (Profil sso): SSO/OIDC-Provider im Produktionsmodus (start, mit
  # eigener PostgreSQL-Datenbank; HTTP nur, weil TLS lokal die Edge fehlt).
  # Importiert den versionierten Realm beim ersten Start; das Client-Secret
  # erzeugt Keycloak dabei selbst (Admin-Konsole -> Clients -> azubios ->
  # Credentials), Nutzer legt der Betreiber an.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    profiles: ["sso"]
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?fehlt in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: http://localhost:8090
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-securemessenger.json:/opt/keycloak/data/import/realm-securemessenger.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8080"
    restart: unless-stopped

  # Optional (Profil web): der Web-Client (WASM) hinter nginx, das /api/* auf
  # die Dienste proxyt (wie der trunk-Dev-Server und der Cluster-Ingress).
  web:
    build:
      context: .
      dockerfile: deploy/compose/web.Dockerfile
    profiles: ["web"]
    depends_on:
      identity:
        condition: service_healthy
      directory:
        condition: service_healthy
      delivery:
        condition: service_healthy
      kt:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
