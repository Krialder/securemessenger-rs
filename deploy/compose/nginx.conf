# nginx des Web-Client-Containers: liefert die WASM-App aus und proxyt /api/*
# same-origin auf die Dienst-Container. Spiegelt Trunk.toml (Dev-Server) und
# deploy/k8s/ingress.yaml (Cluster). Die Dienste sind ueber ihren
# Compose-Namen erreichbar und lauschen intern auf 8080.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket-Hinweiskanal: spezifischer als /api/delivery/, deshalb zuerst.
    # HTTP/1.1 mit Upgrade-Headern, damit der Socket durchgereicht wird.
    location = /api/delivery/ws {
        proxy_pass http://delivery:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Der abschliessende Slash am proxy_pass ersetzt das Pfad-Praefix: aus
    # /api/identity/accounts wird beim identity-Dienst /accounts.
    location /api/identity/  { proxy_pass http://identity:8080/; }
    location /api/directory/ { proxy_pass http://directory:8080/; }
    location /api/delivery/  { proxy_pass http://delivery:8080/; }
    location /api/kt/        { proxy_pass http://kt:8080/; }

    # WASM-Einzelseite: unbekannte Pfade auf index.html (Client-Routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
