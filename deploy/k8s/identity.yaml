# Skelett für den Identitäts-Dienst auf Kubernetes. Image-Tag und Ressourcen
# sind Platzhalter und werden über die GitOps-Pipeline gesetzt (pflichtenheft.md 8.2).
# Zwei Repliken, weil der Dienst auf dem kritischen Pfad liegt (NF060, NF160).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: registry.intern/securemessenger/identity:0.1.0 # Platzhalter
          ports:
            - containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: SERVICE_NAME
              value: "identity"
            - name: RUST_LOG
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-db
                  key: url
            # Schaltet die /internal-Routen frei (Dienst-zu-Dienst, z. B.
            # Token-Introspektion für directory). Gleiches Secret bei allen
            # Diensten, die die internen Routen aufrufen.
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: token
            # Meldet Schlüsseländerungen fire-and-forget ans KT-Verzeichnis
            # (F120); ohne INTERNAL_TOKEN bleiben die Meldungen aus.
            - name: KT_URL
              value: "http://kt"
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app: identity
spec:
  selector:
    app: identity
  ports:
    - name: http
      port: 80
      targetPort: 8080
