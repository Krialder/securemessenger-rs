# Skelett für den Zustelldienst auf Kubernetes. Image-Tag und Ressourcen
# sind Platzhalter und werden über die GitOps-Pipeline gesetzt (pflichtenheft.md 8.2).
# Zwei Repliken für Verfügbarkeit; die WebSocket-Hinweise laufen aber über
# einen In-Prozess-Kanal. [ANNAHME: Bis ein Message-Bus (NATS) die Hinweise
# replikenübergreifend verteilt, kann ein Hinweis auf der "falschen" Replik
# landen. Das ist verschmerzbar: Clients holen beim Verbinden ohnehin den
# Rückstand ab und pollen nach Reconnects.]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  labels:
    app: delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      containers:
        - name: delivery
          image: registry.intern/securemessenger/delivery:0.1.0 # Platzhalter
          ports:
            - containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: SERVICE_NAME
              value: "delivery"
            - name: SM_ENV
              value: "production"
            - name: RUST_LOG
              value: "info"
            - name: IDENTITY_URL
              value: "http://identity"
            # Praesenz-Aenderungen an integrations melden (Webhooks). OHNE
            # diesen Wert laeuft der Webhook-Pfad still als Noop, das Feature
            # ist im Cluster faktisch abgeschaltet.
            - name: INTEGRATIONS_URL
              value: "http://integrations"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: delivery-db
                  key: url
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: token
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: delivery
  labels:
    app: delivery
spec:
  selector:
    app: delivery
  ports:
    - name: http
      port: 80
      targetPort: 8080
