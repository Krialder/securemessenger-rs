# Zusammenbau aller Manifeste: `kubectl apply -k deploy/k8s` bzw. das
# GitOps-Werkzeug (ArgoCD/Flux) zeigt hierauf, damit der Cluster-Zustand
# aus Git folgt (pflichtenheft.md 8.2). Die Operatoren für PostgreSQL,
# Redis, NATS und MinIO sind bewusst nicht Teil dieses Verzeichnisses:
# Zustand läuft über die jeweiligen Operator-Installationen
# (betrieb.md), hier liegen nur die eigenen Dienste.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: securemessenger

resources:
  - namespace.yaml
  - network-policy.yaml
  - identity.yaml
  - directory.yaml
  - delivery.yaml
  - integrations.yaml
  - media.yaml
  - kt.yaml
  - keycloak.yaml
  - ingress.yaml
  - pdb.yaml
  # Erzeugt die ConfigMap keycloak-realm aus dem versionierten Realm-Export
  # (ADR-0011). Als eigene Kustomization-Basis, weil configMapGenerator aus
  # Sicherheitsgruenden keine Dateien oberhalb des eigenen Verzeichnisses
  # laden darf; so bleibt der Export in deploy/keycloak, wo auch der lokale
  # Lauf ihn nutzt.
  - ../keycloak

# Restriktiver securityContext fuer die eigenen Dienste (Pod Security
# Standards "restricted"): als Nicht-Root, mit nur-lesbarem Wurzeldateisystem
# (die Rust-Dienste schreiben nichts auf Platte, ihr Zustand liegt in
# PostgreSQL/S3), ohne Privileg-Eskalation und ohne Linux-Capabilities. Als
# ein Patch ueber alle sechs Dienste (containers/0 ist namensunabhaengig);
# keycloak ist per Namensauswahl ausgenommen, weil sein Image ein
# beschreibbares Dateisystem braucht.
patches:
  - target:
      kind: Deployment
      name: "identity|directory|delivery|integrations|media|kt"
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
