# Edge/Ingress: der einzige Weg von außen zu den Diensten (architektur.md).
# TLS terminiert hier (cert-manager kommt mit der Betriebs-Etappe, darum
# ist die TLS-Sektion ein markierter Platzhalter). Wichtig: die
# /internal-Routen der Dienste tauchen hier bewusst NICHT auf - sie sind
# nur im Cluster-Netz erreichbar, zusätzlich zum Shared-Secret-Guard.
#
# [ANNAHME: ein Host je Zweck (api., sso.) hinter dem NGINX-Ingress;
# Hostnamen sind Platzhalter, die GitOps-Pipeline setzt die echten.]
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securemessenger
  annotations:
    # WebSocket-Verbindungen der Zustellung offen halten.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Medien-Uploads: fachliches Limit sind 50 MiB (media-Dienst).
    nginx.ingress.kubernetes.io/proxy-body-size: "52m"
spec:
  ingressClassName: nginx
  # tls:  # [Platzhalter: cert-manager mit interner CA, Betriebs-Etappe]
  #   - hosts: [api.messenger.intern]
  #     secretName: messenger-tls
  rules:
    - host: api.messenger.intern # Platzhalter
      http:
        paths:
          - path: /accounts
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
          - path: /sessions
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
          - path: /devices
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
          - path: /keys
            pathType: Prefix
            backend:
              service:
                name: directory
                port:
                  number: 80
          - path: /messages
            pathType: Prefix
            backend:
              service:
                name: delivery
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: delivery
                port:
                  number: 80
          - path: /integrations
            pathType: Prefix
            backend:
              service:
                name: integrations
                port:
                  number: 80
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: media
                port:
                  number: 80
    - host: sso.messenger.intern # Platzhalter
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
