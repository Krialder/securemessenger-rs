# Cargo-Workspace für die SecureMessenger-Backend-Dienste.
# Jeder Dienst ist ein eigenes Binary unter services/, gemeinsame Bausteine
# liegen unter crates/. Die Nachrichten-Kryptografie lebt nicht in den
# Backend-Diensten, sondern im Client-Core (libsignal, OpenMLS); das Backend
# hält und verteilt Chiffretext (dokumentation/architektur.md).

[workspace]
resolver = "2"
members = [
    "clients/cli",
    "clients/web",
    "crates/btlog",
    "crates/client-app",
    "crates/client-core",
    "crates/common",
    "crates/franking",
    "crates/keystore",
    "crates/kt-format",
    "crates/oprf",
    "crates/pow",
    "crates/provisioning",
    "crates/sealed-cert",
    "services/delivery",
    "services/directory",
    "services/identity",
    "services/integrations",
    "services/kt",
    "services/media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# AGPL-3.0-only: das Projekt baut auf Signals libsignal (AGPL) auf, der
# kombinierte Netzdienst wird daher unter AGPL offengelegt (Entscheidung
# 13.07.2026, siehe offene-fragen.md). Der volle Lizenztext liegt in LICENSE.
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# ws: der Zustelldienst hält WebSocket-Verbindungen für Echtzeit-Hinweise
# (schnittstellen.md "Echtzeit-Events").
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# std schaltet über password-hash das getrandom-Feature von rand_core frei,
# ohne das gibt es kein OsRng für Salt- und Token-Erzeugung.
argon2 = { version = "0.5", features = ["std"] }
# Für das Ablegen von Session-Tokens als Hash (kein Passwort-Hashing, dafür
# ist argon2 da; Begründung in services/identity/src/auth.rs).
sha2 = "0.10"
# Signatur-VERIFIKATION der Geräte-Credentials (specs/geraete-identitaet.md).
# Der Server hält keine privaten Schlüssel, er prüft nur, was Clients signieren.
ed25519-dalek = "2"
base64 = "0.22"
# Persistenz: PostgreSQL ohne ORM, Migrationen eingebettet ins Binary
# (migrate!-Makro), damit das Container-Image keine losen SQL-Dateien braucht.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid"] }
# async fn in Traits ist stable, macht Traits aber nicht dyn-kompatibel;
# die Stores stecken als Arc<dyn ...> im axum-State, deshalb async-trait.
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dienst-zu-Dienst-HTTP (directory/delivery -> identity /internal, Baustein
# in crates/common). rustls statt nativer TLS, damit das Container-Image
# ohne OpenSSL auskommt.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Objektspeicher-Anbindung des Medien-Dienstes: eine API für S3/MinIO
# (Betriebsziel, NF120), lokales Dateisystem und In-Memory (Tests).
# Apache-Projekt, kein Eigenbau der S3-Signaturen.
object_store = { version = "0.12", features = ["aws"] }
# Key Transparency: Metas auditable key directory, exakt das Modell aus
# specs/key-transparency.md (verifiable map + append-only Log + VRF).
# Exakt gepinnt; kein Eigenbau von Merkle-Bäumen. Standard-Features:
# ohne public_auditing kompiliert 0.12.0 nicht (Feature-Gating-Fehler
# upstream); der protobuf-Crate dahinter ist reines Rust, kein protoc.
akd = { version = "=0.12.0", features = ["serde_serialization"] }
# OS-Zufall für Schlüsselerzeugung im kt-Dienst (Dev-Betrieb ohne Secrets).
rand = "0.10"
common = { path = "crates/common" }
# Kanonische KT-Byte-Formate, geteilt zwischen Server und Clients (auch wasm32).
kt-format = { path = "crates/kt-format" }
# OPRF-Kern für Contact Discovery, geteilt zwischen Client und Server.
oprf = { path = "crates/oprf" }
# Message-Franking-Commitment, geteilt zwischen Client (committen) und
# Server (Meldung verifizieren).
franking = { path = "crates/franking" }
# Proof-of-Work-Sybil-Bremse, geteilt zwischen Client (lösen) und Server
# (prüfen).
pow = { path = "crates/pow" }
# Sealed-Sender-Zertifikate: identity stellt aus, Clients prüfen beim
# Entsiegeln (Format aus libsignal, kein Eigenbau).
sealed-cert = { path = "crates/sealed-cert" }
# Verschlüsselte Geräte-Ablage, geteilt zwischen CLI und Web-Client.
keystore = { path = "crates/keystore" }
# Provisioning-Chiffre für die QR-Kopplung: das Zweitgerät verschlüsselt
# seinen Kopplungs-Antrag unter einem im QR gezeigten Geheimnis, der Relay
# transportiert nur opaken Chiffretext. Geteilt zwischen den Clients.
provisioning = { path = "crates/provisioning" }
# Property-Tests (Roadmap Phase 6): zufällig erzeugte Eingaben gegen
# Invarianten der Parser und der Krypto-Integration.
proptest = "1"

# Argon2 ist in Debug-Builds unbrauchbar langsam (Sekunden pro Hash).
# Die Krypto-Pakete werden deshalb auch im Dev-Profil optimiert gebaut,
# damit Tests und lokale Läufe schnell bleiben.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
